<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--surface:#fff;--text:#1d2330;--muted:#5b6475;--line:#dfe2e8;--accent:#1f4e79;--accent-soft:#e8eff7;--danger:#b42318;--ok:#067647;--warn:#b54708}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101318;--surface:#181c23;--text:#e6e8ec;--muted:#9aa3b2;--line:#2a303b;--accent:#7fb2e5;--accent-soft:#1d2a3a;--danger:#f97066;--ok:#47cd89;--warn:#fdb022}}
:root[data-theme="dark"]{--bg:#101318;--surface:#181c23;--text:#e6e8ec;--muted:#9aa3b2;--line:#2a303b;--accent:#7fb2e5;--accent-soft:#1d2a3a;--danger:#f97066;--ok:#47cd89;--warn:#fdb022}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:80px}
input[type=checkbox]{width:auto}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:6px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.danger{color:var(--danger)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:16px;margin:0 auto 0 0}
#status{font-size:13px;color:var(--muted)}
#status.ok{color:var(--ok)}#status.err{color:var(--danger)}#status.warn{color:var(--warn)}
.layout{display:grid;grid-template-columns:220px 1fr;max-width:1100px;margin:0 auto;gap:24px;padding:24px 16px}
@media (max-width:760px){.layout{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;gap:6px}.side button{white-space:nowrap}}
.side button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:6px;font-weight:500}
.side button.on{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.panel h2{margin:0 0 4px;font-size:20px}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 18px}
.field{margin-bottom:14px}
.field label.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.field .help{font-size:12px;color:var(--muted);margin-top:3px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
details.item{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--bg)}
details.item>summary{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;list-style:none}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary .ttl{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.item>summary .ttl small{color:var(--muted);font-weight:400;margin-left:6px}
details.item[open]>summary{border-bottom:1px solid var(--line)}
details.item .body{padding:14px 12px 4px}
.listhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;gap:8px}
.listhead .count{color:var(--muted);font-size:13px}
.nested{border-left:3px solid var(--accent-soft);padding-left:12px}
.imgrow{display:flex;gap:10px;align-items:center}
.imgrow img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.settings{max-width:560px}
.note{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:16px}
.note ol{margin:6px 0 0;padding-left:18px}
.filter{margin-bottom:10px}
</style>
</head>
<body>

<div class="top">
  <h1>✎ Site Editor</h1>
  <span id="status">Not connected</span>
  <a class="btn" id="viewSite" href="./" target="_blank" rel="noopener">View site</a>
  <button class="btn" id="downloadBtn" title="Download a backup copy of content.json">Backup</button>
  <button class="btn primary" id="saveBtn" disabled>Publish changes</button>
</div>

<div class="layout">
  <div class="side" id="side"></div>
  <div id="main"></div>
</div>

<script>
/* ---------- What can be edited ---------- */
const SCHEMA = [
  { key:'profile', label:'Profile', type:'object', hint:'Your name, title, bio and photo shown at the top of the site.', fields:[
    { key:'name', label:'Full name' },
    { key:'shortName', label:'Short name (top-left of the menu bar)' },
    { key:'credentials', label:'Qualifications & memberships' },
    { key:'role', label:'Current position' },
    { key:'affiliation', label:'Institution' },
    { key:'photo', label:'Profile photo', type:'image' },
    { key:'bio', label:'About me', type:'textarea', rows:6 },
    { key:'interests', label:'Research interests', type:'tags', help:'Separate with commas.' },
    { key:'highlightName', label:'Name to underline in author lists', help:'e.g. Wijewickrama — every author entry containing this is underlined in Publications.' }
  ]},
  { key:'links', label:'Profile links', type:'list', hint:'Buttons under your bio (Scholar, ORCID, LinkedIn, GitHub, email…). Icons are picked automatically.', titleOf:x=>x.label, fields:[
    { key:'label', label:'Button text' },
    { key:'url', label:'Link', help:'For email use mailto:you@example.com' }
  ]},
  { key:'research', label:'Current research', type:'list', titleOf:x=>x.title, fields:[
    { key:'title', label:'Title' },
    { key:'meta', label:'Collaborators / institutions' },
    { key:'description', label:'Description', type:'textarea' }
  ]},
  { key:'publications', label:'Publications', type:'list', hint:'Grouped on the site by category. Within a category, items appear in the order listed here — new items are added at the top.', titleOf:x=>x.title, subOf:x=>x.category, filter:true, fields:[
    { key:'category', label:'Category', type:'suggest', options:['Journal Articles','Book Chapters','Conference Papers & Abstracts','Oral Presentations','Poster Presentations'] },
    { key:'authors', label:'Authors' },
    { key:'title', label:'Title' },
    { key:'venue', label:'Journal / conference / book' },
    { key:'details', label:'Volume, year, location, notes' },
    { key:'url', label:'DOI or link (optional)' },
    { key:'urlText', label:'Link text', help:'e.g. doi:10.3390/polym17172345' },
    { key:'status', label:'Status label (optional)', type:'suggest', options:['Under review','Accepted','In press'] },
    { key:'award', label:'Award label (optional)', help:'e.g. Best Paper' }
  ]},
  { key:'experience', label:'Experience', type:'list', titleOf:x=>x.title, subOf:x=>x.when, fields:[
    { key:'when', label:'Dates', help:'e.g. Jan 2026 – Present' },
    { key:'title', label:'Position' },
    { key:'org', label:'Organisation' },
    { key:'orgUrl', label:'Organisation link (optional)' },
    { key:'description', label:'Description', type:'textarea' },
    { key:'current', label:'Show "Current" badge', type:'checkbox' }
  ]},
  { key:'education', label:'Education', type:'list', titleOf:x=>x.title, subOf:x=>x.when, fields:[
    { key:'when', label:'Dates' },
    { key:'title', label:'Qualification' },
    { key:'org', label:'Institution' },
    { key:'description', label:'Details', type:'textarea' }
  ]},
  { key:'awards', label:'Awards', type:'list', hint:'Each group becomes a card on the site.', titleOf:x=>x.heading, fields:[
    { key:'heading', label:'Group heading' },
    { key:'items', label:'Awards', type:'lines', help:'One award per line.' }
  ]},
  { key:'contact', label:'Contact', type:'object', fields:[
    { key:'office', label:'Office address', type:'textarea' },
    { key:'emails', label:'Email addresses', type:'list', titleOf:x=>x.address, fields:[
      { key:'address', label:'Email' }, { key:'label', label:'Label', help:'e.g. office, personal' }
    ]}
  ]},
  { key:'footer', label:'Footer', type:'text', hint:'Small text at the very bottom of the page.' }
];

/* ---------- State ---------- */
let data = null, sha = null, dirty = false, current = 'profile';
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
function guessRepo(){
  const h = location.hostname;
  if (h.endsWith('.github.io')) {
    const owner = h.split('.')[0];
    const seg = location.pathname.split('/').filter(Boolean)[0];
    const repo = seg && !seg.endsWith('.html') ? seg : h;
    return { owner, repo };
  }
  return { owner:'', repo:'' };
}
const g = guessRepo();
const cfg = {
  owner: store.get('cms_owner') || g.owner,
  repo: store.get('cms_repo') || g.repo,
  branch: store.get('cms_branch') || 'main',
  token: store.get('cms_token') || (()=>{ try { return sessionStorage.getItem('cms_token'); } catch { return null; } })() || ''
};

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'on') for (const [ev,fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'class') e.className = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => c != null && e.append(c.nodeType ? c : document.createTextNode(c)));
  return e;
};
function status(msg, kind=''){ const s=$('#status'); s.textContent=msg; s.className=kind; }
function markDirty(){ dirty = true; $('#saveBtn').disabled = !data; status('Unsaved changes', 'warn'); }
const b64encode = str => { const bytes = new TextEncoder().encode(str); let bin=''; for (let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); };
const b64decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g,'')), c => c.charCodeAt(0)));
const blank = fields => Object.fromEntries(fields.map(f => [f.key, f.type==='checkbox' ? false : (f.type==='tags'||f.type==='lines'||f.type==='list') ? [] : '']));

/* ---------- GitHub API ---------- */
async function gh(path, opts={}){
  const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}${opts.method ? '' : `?ref=${encodeURIComponent(cfg.branch)}`}`, {
    ...opts,
    headers: { 'Accept':'application/vnd.github+json', ...(cfg.token ? { 'Authorization':`Bearer ${cfg.token}` } : {}), ...(opts.body ? {'Content-Type':'application/json'} : {}) }
  });
  if (!res.ok) {
    let m = ''; try { m = (await res.json()).message; } catch {}
    const e = new Error(m || res.statusText); e.status = res.status; throw e;
  }
  return res.json();
}
async function loadContent(){
  status('Loading…');
  try {
    const f = await gh('content.json');
    sha = f.sha; data = JSON.parse(b64decode(f.content));
    status(cfg.token ? 'Connected — ready to edit' : 'Loaded (read-only: add your token in Settings to publish)', cfg.token ? 'ok' : 'warn');
  } catch (e) {
    try {
      data = await (await fetch('content.json', {cache:'no-cache'})).json(); sha = null;
      status('Loaded local copy — connect GitHub in Settings to publish', 'warn');
    } catch { status('Could not load content: ' + e.message, 'err'); current = 'settings'; }
  }
  dirty = false; $('#saveBtn').disabled = true; draw();
}
async function publish(){
  if (!cfg.token) { current='settings'; draw(); status('Add your GitHub token first', 'err'); return; }
  const btn = $('#saveBtn'); btn.disabled = true; status('Publishing…');
  try {
    try { sha = (await gh('content.json')).sha; } catch (e) { if (e.status !== 404) throw e; sha = null; }
    const res = await gh('content.json', { method:'PUT', body: JSON.stringify({
      message: 'Update website content', branch: cfg.branch, sha: sha || undefined,
      content: b64encode(JSON.stringify(data, null, 2) + '\n')
    })});
    sha = res.content.sha; dirty = false;
    status('Published ✓ — live on your site in about a minute', 'ok');
  } catch (e) {
    btn.disabled = false;
    status(e.status === 401 ? 'Token rejected — check it in Settings' : e.status === 403 || e.status === 404 ? 'No write access — check repository name and token permissions' : 'Publish failed: ' + e.message, 'err');
  }
}
async function uploadImage(file){
  if (!cfg.token) throw new Error('Connect GitHub in Settings first');
  if (file.size > 5e6) throw new Error('Please use an image under 5 MB');
  const b64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.onerror = no; r.readAsDataURL(file); });
  const name = 'images/' + Date.now() + '-' + file.name.toLowerCase().replace(/[^a-z0-9.]+/g,'-');
  await gh(name, { method:'PUT', body: JSON.stringify({ message:'Upload ' + file.name, branch: cfg.branch, content: b64 }) });
  return name;
}

/* ---------- Form rendering ---------- */
function fieldEl(f, obj){
  const wrap = el('div', { class:'field' });
  const id = 'f' + Math.random().toString(36).slice(2);
  const set = v => { obj[f.key] = v; markDirty(); };
  if (f.type !== 'checkbox' && f.type !== 'list') wrap.append(el('label', { class:'lbl', for:id }, f.label));

  switch (f.type) {
    case 'textarea':
      wrap.append(el('textarea', { id, rows: f.rows || 4, on:{ input:e=>set(e.target.value) } }, obj[f.key] || '')); break;
    case 'checkbox':
      const cb = el('input', { type:'checkbox', id, on:{ change:e=>set(e.target.checked) } }); cb.checked = !!obj[f.key];
      wrap.append(el('label', { class:'check', for:id }, cb, f.label)); break;
    case 'tags':
      wrap.append(el('input', { id, value:(obj[f.key]||[]).join(', '), on:{ input:e=>set(e.target.value.split(',').map(s=>s.trim()).filter(Boolean)) } })); break;
    case 'lines':
      wrap.append(el('textarea', { id, rows: Math.max(4, (obj[f.key]||[]).length + 1), on:{ input:e=>set(e.target.value.split('\n').map(s=>s.trim()).filter(Boolean)) } }, (obj[f.key]||[]).join('\n'))); break;
    case 'suggest':
      const dl = id + 'l';
      wrap.append(el('input', { id, list:dl, value:obj[f.key]||'', on:{ input:e=>set(e.target.value) } }),
                  el('datalist', { id:dl }, f.options.map(o => el('option', { value:o }))));
      break;
    case 'image': {
      const img = el('img', { src: obj[f.key] || '', alt:'' }); if (!obj[f.key]) img.style.display='none';
      const txt = el('input', { id, value:obj[f.key]||'', placeholder:'images/photo.jpg or https://…', on:{ input:e=>{ set(e.target.value); img.src=e.target.value; img.style.display=e.target.value?'':'none'; } } });
      const file = el('input', { type:'file', accept:'image/*', style:'display:none', on:{ change: async e => {
        const fl = e.target.files[0]; if (!fl) return;
        status('Uploading image…');
        try { const p = await uploadImage(fl); txt.value = p; set(p); img.src = URL.createObjectURL(fl); img.style.display=''; status('Image uploaded — click Publish changes to use it', 'warn'); }
        catch (err) { status(err.message, 'err'); }
      }}});
      wrap.append(el('div', { class:'imgrow' }, img, txt, el('button', { class:'btn', type:'button', on:{ click:()=>file.click() } }, 'Upload'), file));
      break;
    }
    case 'list':
      wrap.append(el('label', { class:'lbl' }, f.label), el('div', { class:'nested' }, listEl(f, obj))); break;
    default:
      wrap.append(el('input', { id, value:obj[f.key] ?? '', on:{ input:e=>set(e.target.value) } }));
  }
  if (f.help) wrap.append(el('div', { class:'help' }, f.help));
  return wrap;
}

function listEl(def, parent){
  if (!Array.isArray(parent[def.key])) parent[def.key] = [];
  const arr = parent[def.key];
  const box = el('div');
  let q = '';
  const redraw = (openIdx) => {
    box.innerHTML = '';
    const head = el('div', { class:'listhead' },
      el('span', { class:'count' }, `${arr.length} item${arr.length===1?'':'s'}`),
      el('button', { class:'btn sm', type:'button', on:{ click:()=>{ arr.unshift(blank(def.fields)); markDirty(); redraw(0); } } }, '+ Add new'));
    box.append(head);
    if (def.filter) {
      const fi = el('input', { class:'filter', placeholder:'Search…', value:q, on:{ input:e=>{ q=e.target.value.toLowerCase(); redraw(); fi_focus(); } } });
      const fi_focus = () => { const n = box.querySelector('.filter'); n.focus(); n.setSelectionRange(q.length,q.length); };
      box.append(fi);
    }
    arr.forEach((item, i) => {
      if (q && !JSON.stringify(item).toLowerCase().includes(q)) return;
      const ttl = el('span', { class:'ttl' }, (def.titleOf?.(item)) || '(untitled)', def.subOf?.(item) ? el('small', {}, def.subOf(item)) : null);
      const stop = fn => e => { e.preventDefault(); e.stopPropagation(); fn(); };
      const d = el('details', { class:'item', open: i === openIdx },
        el('summary', {}, ttl,
          el('button', { class:'btn sm', type:'button', title:'Move up', on:{ click:stop(()=>{ if(i>0){ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; markDirty(); redraw(); } }) } }, '↑'),
          el('button', { class:'btn sm', type:'button', title:'Move down', on:{ click:stop(()=>{ if(i<arr.length-1){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; markDirty(); redraw(); } }) } }, '↓'),
          el('button', { class:'btn sm', type:'button', title:'Duplicate', on:{ click:stop(()=>{ arr.splice(i+1,0,JSON.parse(JSON.stringify(item))); markDirty(); redraw(i+1); }) } }, '⧉'),
          el('button', { class:'btn sm danger', type:'button', title:'Delete', on:{ click:stop(()=>{ if(confirm('Delete this item?')){ arr.splice(i,1); markDirty(); redraw(); } }) } }, '✕')),
        el('div', { class:'body' }, def.fields.map(f => fieldEl(f, item))));
      // live-update the summary title while typing
      d.addEventListener('input', () => { ttl.firstChild.textContent = (def.titleOf?.(item)) || '(untitled)'; if (def.subOf && ttl.querySelector('small')) ttl.querySelector('small').textContent = def.subOf(item) || ''; });
      box.append(d);
    });
  };
  redraw();
  return box;
}

function settingsPanel(){
  const p = el('div', { class:'panel settings' }, el('h2', {}, 'GitHub connection'),
    el('p', { class:'hint' }, 'Needed once per device. Your token is stored only in this browser.'),
    el('div', { class:'note' }, 'How to get a token:',
      el('ol', {},
        el('li', {}, 'On GitHub: profile picture → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.'),
        el('li', {}, 'Repository access: "Only select repositories" → choose your website repository.'),
        el('li', {}, 'Permissions → Repository permissions → Contents: Read and write.'),
        el('li', {}, 'Generate, copy the token and paste it below.'))));
  const inp = (k, label, extra={}) => {
    const i = el('input', { value: cfg[k] || '', ...extra, on:{ input:e=>cfg[k]=e.target.value.trim() } });
    return el('div', { class:'field' }, el('label', { class:'lbl' }, label), i);
  };
  const rem = el('input', { type:'checkbox', id:'rem' }); rem.checked = !!store.get('cms_token') || !cfg.token;
  p.append(
    inp('owner', 'GitHub username'),
    inp('repo', 'Repository name', { placeholder:'username.github.io' }),
    inp('branch', 'Branch'),
    inp('token', 'Access token', { type:'password', placeholder:'github_pat_…', autocomplete:'off' }),
    el('div', { class:'field' }, el('label', { class:'check', for:'rem' }, rem, 'Remember token on this device (untick on shared computers)')),
    el('div', { style:'display:flex;gap:8px;flex-wrap:wrap' },
      el('button', { class:'btn primary', type:'button', on:{ click: async ()=>{
        ['owner','repo','branch'].forEach(k => store.set('cms_'+k, cfg[k]));
        if (rem.checked) store.set('cms_token', cfg.token); else { store.del('cms_token'); try{ sessionStorage.setItem('cms_token', cfg.token); }catch{} }
        current = 'profile'; await loadContent();
      }}}, 'Save & connect'),
      el('button', { class:'btn danger', type:'button', on:{ click:()=>{ ['owner','repo','branch','token'].forEach(k=>store.del('cms_'+k)); try{sessionStorage.removeItem('cms_token');}catch{} cfg.token=''; status('Signed out'); draw(); } } }, 'Sign out / forget token')));
  return p;
}

function draw(){
  const side = $('#side'); side.innerHTML = '';
  [...SCHEMA.map(s => [s.key, s.label]), ['settings','⚙ Settings']].forEach(([k, l]) =>
    side.append(el('button', { class: k===current ? 'on' : '', on:{ click:()=>{ current=k; draw(); } } }, l)));
  const main = $('#main'); main.innerHTML = '';
  if (current === 'settings' || !data) { main.append(settingsPanel()); return; }
  const def = SCHEMA.find(s => s.key === current);
  const panel = el('div', { class:'panel' }, el('h2', {}, def.label), def.hint ? el('p', { class:'hint' }, def.hint) : el('p', { class:'hint' }));
  if (def.type === 'object') { data[def.key] ??= {}; def.fields.forEach(f => panel.append(fieldEl(f, data[def.key]))); }
  else if (def.type === 'list') panel.append(listEl(def, data));
  else panel.append(fieldEl({ key:def.key, label:def.label }, data));
  main.append(panel);
}

$('#saveBtn').addEventListener('click', publish);
$('#downloadBtn').addEventListener('click', () => {
  if (!data) return;
  const a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'})), download:'content-backup-' + new Date().toISOString().slice(0,10) + '.json' });
  a.click();
});
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

if (cfg.owner && cfg.repo) loadContent(); else { current = 'settings'; draw(); }
</script>
</body>
</html>
